name: Update BigQuery from Data.gov.sg API

on:
  # Run weekly on Monday at 00:30 UTC (08:30 SGT)
  schedule:
    - cron: "30 0 * * 1"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update-bigquery:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit the updated CSV back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-cloud-bigquery google-auth pandas

      - name: Run BigQuery update script
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_DATASET_ID: ${{ secrets.GCP_DATASET_ID }}
          GCP_TABLE_ID: ${{ secrets.GCP_TABLE_ID }}
        run: |
          python scripts/update_bigquery.py

      - name: Commit updated CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ResaleflatpricesbasedonregistrationdatefromJan2017onwards.csv
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to CSV. Skipping commit."
          else
            git commit -m "chore: update HDB resale data CSV from Data.gov.sg API"
            git push
          fi
